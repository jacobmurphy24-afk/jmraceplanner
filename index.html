<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Training Planner</title>
  <meta name="description" content="Plan your race calendar and the training blocks inside it.">
  <meta name="theme-color" content="#111111">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Training">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="calendar">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-activity" viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-calendar" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15.5" rx="1"/><path d="M3.5 10h17M8 3v4M16 3v4"/></g></symbol>
      <symbol id="i-chart" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20h16"/><path d="M7 16v-5M12 16V7M17 16v-8"/></g></symbol>
      <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.3a4.3 4.3 0 0 1 7.5 2.5C19.5 15.4 12 20 12 20z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
      <symbol id="i-gear" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.6M12 18.6v2.6M2.8 12h2.6M18.6 12h2.6M5.5 5.5l1.8 1.8M16.7 16.7l1.8 1.8M5.5 18.5l1.8-1.8M16.7 7.3l1.8-1.8" stroke-linecap="round"/></g></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
      <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M4 20l1-4L16 5l3 3L8 19z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></g></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2"><rect x="8" y="8" width="12" height="12" rx="1"/><path d="M16 8V4H4v12h4"/></g></symbol>
      <symbol id="i-paste" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="5" width="14" height="16" rx="1"/><path d="M9 3h6v4H9zM9 13l2 2 4-4"/></g></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></g></symbol>
      <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7V5h6l2 2h10v12H3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
      <symbol id="i-bookmark" viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
      <symbol id="i-chev-l" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-chev-r" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    </defs>
  </svg>

  <div id="gate"></div>

  <div class="app">
    <!-- Desktop sidebar -->
    <aside class="side">
      <div class="brand"><div class="logo"><svg class="ic"><use href="#i-activity"/></svg></div>
        <div><div class="brand-t">Training Planner</div><div class="brand-s">Schedule &amp; analytics</div></div></div>
      <div id="side-account"></div>
      <div class="side-section">Workspace</div>
      <nav class="nav">
        <button data-page="calendar"><svg class="ic"><use href="#i-calendar"/></svg>Calendar</button>
        <button data-page="reports"><svg class="ic"><use href="#i-chart"/></svg>Block reports</button>
        <button data-page="garmin"><svg class="ic"><use href="#i-activity"/></svg>Analysis</button>
      </nav>
      <div class="side-section">Calendar</div>
      <div class="seg seg-full"><button class="chip" data-mode="Month">Month</button><button class="chip" data-mode="Year">Year</button></div>
      <div class="side-mid" id="side-day"></div>
      <div class="side-foot">
        <div class="side-section">Data</div>
        <div class="data-row">
          <button class="btn btn-ghost" data-action="settings"><svg class="ic"><use href="#i-gear"/></svg>Settings</button>
          <button class="btn btn-ghost" data-action="save-plan"><svg class="ic"><use href="#i-download"/></svg>Save plan</button>
          <button class="btn btn-ghost" data-action="load-plan"><svg class="ic"><use href="#i-folder"/></svg>Load plan</button>
        </div>
      </div>
    </aside>

    <!-- Phone top bar -->
    <header class="topbar">
      <div class="brand"><div class="logo"><svg class="ic"><use href="#i-activity"/></svg></div><div class="brand-t">Training Planner</div></div>
      <button class="top-plan" id="top-plan" aria-label="Plans and sharing" style="display:none"></button>
      <div class="seg top-seg"><button class="chip" data-mode="Month">Month</button><button class="chip" data-mode="Year">Year</button></div>
      <button class="btn btn-icon" data-action="save-plan" aria-label="Save plan" title="Save plan"><svg class="ic"><use href="#i-download"/></svg></button>
      <button class="btn btn-icon" data-action="load-plan" aria-label="Load plan" title="Load plan"><svg class="ic"><use href="#i-folder"/></svg></button>
      <button class="btn btn-icon" data-action="settings" aria-label="Settings"><svg class="ic"><use href="#i-gear"/></svg></button>
    </header>
    <input type="file" id="plan-file" accept=".json,application/json" hidden>

    <main id="main"></main>

    <!-- Phone tab bar -->
    <nav class="tabbar">
      <button data-page="calendar"><svg class="ic"><use href="#i-calendar"/></svg><span>Calendar</span></button>
      <button data-page="reports"><svg class="ic"><use href="#i-chart"/></svg><span>Reports</span></button>
      <button data-action="add-session" class="tab-add" aria-label="Add session"><svg class="ic"><use href="#i-plus"/></svg></button>
      <button data-page="garmin"><svg class="ic"><use href="#i-activity"/></svg><span>Analysis</span></button>
      <button data-action="add-event"><svg class="ic"><use href="#i-plus"/></svg><span>Event</span></button>
    </nav>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root"></div>
  <div id="print-root"></div>

  <script src="vendor/firebase.js"></script>
  <script src="vendor/fitsdk.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/constants.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/analysis.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/forms.js"></script>
  <script src="js/reports.js"></script>
  <script src="js/cloud.js"></script>
  <script src="js/account.js"></script>
  <script src="js/match.js"></script>
  <script src="js/garmin.js"></script>
  <script src="js/pages.js"></script>
  <script src="js/activity.js"></script>
  <script src="js/coach.js"></script>
  <script src="js/blocks.js"></script>
  <script src="js/myweek.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
